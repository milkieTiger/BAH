name: Frontend CI

on:
  pull_request:
    branches: [master, dev]

# Cancel in-progress runs for the same branch (new pushes supersede old ones)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    # All run steps default to the Next.js app directory
    defaults:
      run:
        working-directory: web_client/bah-nextjs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm/action-setup reads the packageManager field from package.json
      # so it auto-detects the correct pnpm version (11.15.1)
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web_client/bah-nextjs/package.json

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web_client/bah-nextjs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Code quality gates ──────────────────────────────────

      - name: Check formatting (Prettier)
        run: pnpm run format:check

      - name: Lint (ESLint)
        run: pnpm run lint

      - name: Type check (TypeScript)
        run: pnpm exec tsc --noEmit

      # ── Build ───────────────────────────────────────────────
      - name: Build (Next.js)
        run: pnpm run build
        # Verifies that next build succeeds with output: "standalone"

      # ── E2E tests ───────────────────────────────────────────

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests (Playwright)
        run: pnpm run test:e2e
        # playwright.config.ts auto-starts `pnpm dev` via webServer.
        # CI config: retries=2, workers=1, forbidOnly=true.

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web_client/bah-nextjs/playwright-report/
          retention-days: 7
