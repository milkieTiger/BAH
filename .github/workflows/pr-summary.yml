name: "PR Description Summary"

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  summarize:
    name: Generate PR Summary
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_client/bah-nextjs

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/github-script@v7
        id: generate-summary
        with:
          script: |
            const pr = context.payload.pull_request;
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            // Only include frontend files
            const frontendFiles = files.filter(f => f.filename.startsWith('web_client/bah-nextjs/'));
            const otherFiles = files.filter(f => !f.filename.startsWith('web_client/bah-nextjs/'));

            const grouped = {};

            for (const file of frontendFiles) {
              const relPath = file.filename.replace('web_client/bah-nextjs/', '');
              const parts = relPath.split('/');
              const topDir = parts[0] === 'app' || parts[0] === 'components'
                ? parts[0] + '/' + (parts[1] || '')
                : parts[0];
              const key = topDir || '(root)';
              if (!grouped[key]) grouped[key] = { added: 0, deleted: 0, files: [] };
              grouped[key].added += file.additions;
              grouped[key].deleted += file.deletions;
              grouped[key].files.push(relPath);
            }

            let summary = `## 📋 PR Summary\n\n`;

            if (otherFiles.length > 0) {
              summary += `**Repo-wide:** ${otherFiles.length} file(s) changed\n\n`;
            }

            summary += `**Frontend** — ${frontendFiles.length} file(s) changed — **+${frontendFiles.reduce((s, f) => s + f.additions, 0)}** / **-${frontendFiles.reduce((s, f) => s + f.deletions, 0)}** lines\n\n`;
            summary += `| Area | Files | Changes |\n`;
            summary += `|------|-------|--------|\n`;

            for (const [area, info] of Object.entries(grouped)) {
              const changeStr = `+${info.added}/-${info.deleted}`;
              summary += `| \`${area}\` | ${info.files.length} | ${changeStr} |\n`;
            }

            summary += `\n### 📄 Changed Files\n\n`;
            for (const file of files) {
              const display = file.filename.replace('web_client/bah-nextjs/', '');
              const status = file.status === 'added' ? '✨ Added'
                : file.status === 'removed' ? '🗑️ Removed'
                : '📝 Modified';
              summary += `- ${status} — \`${display}\`\n`;
            }

            summary += `\n---\n> _🤖 Auto-generated summary_`;

            // Post or update summary as a comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('🤖 Auto-generated summary')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: summary,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: summary,
              });
            }

            return summary;
